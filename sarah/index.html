<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sarahs önskelista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: a winter scene band on top, then one column of grouped rows, with snow falling over the page. Single dark winter theme by choice. */
  :root {
    --bg: #0f1733;
    --surface: #17224b;
    --ink: #f3f3fb;
    --muted: #b1badb;
    --accent: #ff6fa8;
    --link: #8fe8f5;
    --line: #283a6e;
    --star: #ffd27a;
    --display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
    --body: "DM Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }

  .hero { position: relative; display: block; height: clamp(290px, 40vw, 380px); overflow: hidden; }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 56px;
    background: linear-gradient(to bottom, rgba(15, 23, 51, 0), var(--bg));
    pointer-events: none;
  }
  .hero-text {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 16px 0;
    display: grid;
    align-content: start;
    gap: 6px;
  }
  .hero h1 { color: #ffffff; text-shadow: 0 2px 18px rgba(8, 12, 36, 0.65); }
  .hero .kicker { text-shadow: 0 1px 10px rgba(8, 12, 36, 0.6); }
  .back {
    justify-self: start;
    color: #ffffff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 6px 0;
    text-shadow: 0 1px 10px rgba(8, 12, 36, 0.6);
  }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
  .snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.45;
    padding-bottom: 40px;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 12px 16px 16px;
    display: grid;
    gap: 28px;
  }
  header { display: grid; gap: 10px; }
  .kicker {
    font-family: var(--display);
    font-weight: 500;
    color: var(--link);
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(30px, 7.5vw, 44px);
    line-height: 1.08;
    margin: 0;
    text-wrap: balance;
  }
  h1 span { color: var(--accent); }
  .intro { margin: 0; color: var(--muted); max-width: 60ch; }
  .intro strong { color: var(--ink); }

  #groups { display: grid; gap: 28px; }
  section { display: grid; gap: 10px; }
  h2 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 18px;
    margin: 0;
    display: flex;
    align-items: baseline;
    gap: 10px;
    text-wrap: balance;
  }
  h2 .count {
    font-family: var(--body);
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  .list {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .item {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    align-items: start;
    padding: 14px 16px;
    border-top: 1px solid var(--line);
  }
  .item:first-child { border-top: 0; }
  .link:focus-visible { outline: 2px solid var(--star); outline-offset: 2px; }
  .body { display: grid; gap: 4px; padding-top: 2px; min-width: 0; }
  .name { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
  .tag {
    justify-self: start;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
    border-radius: 999px;
    padding: 1px 8px;
  }
  .desc { color: var(--muted); font-size: 15px; }
  .link {
    justify-self: start;
    margin-top: 4px;
    font-weight: 700;
    font-size: 15px;
    color: var(--link);
    text-decoration: none;
    border-bottom: 2px solid color-mix(in srgb, var(--link) 35%, transparent);
  }
  .link:hover { border-bottom-color: var(--link); }

  footer { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header class="hero">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="hero-text">
    <a class="back" href="../">← Alla önskelistor</a>
    <div class="kicker">God jul 2026</div>
    <h1>Sarahs <span>önskelista</span></h1>
  </div>
</header>
<canvas id="snow" class="snow" aria-hidden="true"></canvas>
<main class="wrap">
  <p class="intro">Allt du har önskat dig, samlat på ett ställe.</p>

  <div id="groups"></div>

  <footer>Länkarna går till Amazon, Akademibokhandeln, AliExpress och en K-pop-butik. Där det står ”Sök på Amazon” kommer du till en sökning efter saken.</footer>
</main>

<script>
  const GROUPS = [
    { title: "Alien Stage", items: [
      { id: "artbook", name: "ALIEN STAGE: The Art Book", desc: "Artboken på engelska med konceptkonst, karaktärsprofiler och intervjuer med skaparna.", url: "https://amzn.eu/d/04Jh1tuH", label: "Se på Amazon" },
      { id: "pouch", name: "Hörlursfodral från Anakt Arts High School", tag: "Blindbox", desc: "Silikonfodral med figurerna i skoluniform. Sex olika: Mizi, Sua, Till, Ivan, Luka och Hyuna.", url: "https://www.aliexpress.us/item/3256811971027340.html", label: "Se på AliExpress" },
      { id: "pom", name: "Pom-nyckelring (Free Stage)", tag: "Blindbox", desc: "Fluffig pompom med en av figurerna som tittar upp. Sex olika att samla på.", url: "https://www.amazon.se/s?k=YJacuing+Alien+Stage+Free+Stage+pom+keychain", label: "Sök på Amazon" },
      { id: "cards", name: "Fotokort, Idol Series", desc: "Sex kort med alla huvudkaraktärerna.", url: "https://www.amazon.se/s?k=YJacuing+Alien+Stage+photo+cards+Idol+Series", label: "Sök på Amazon" },
      { id: "mask", name: "Sovmask med Ivan", desc: "Mjuk sovmask från Passion Love-serien.", url: "https://www.amazon.se/s?k=YJacuing+Alien+Stage+plush+eye+mask+Ivan", label: "Sök på Amazon" }
    ]},
    { title: "Böcker", items: [
      { id: "fnaf", name: "Five Nights at Freddy’s, interaktiv bok", desc: "Du väljer själv vad som händer, och det finns över 25 slut. Det finns fyra böcker i serien. Fråga Sarah vilka hon redan har.", url: "https://akademibokhandeln.se/bok/five-nights-at-freddys-the-week-before-an-interactive-novel-1/9781546131113", label: "Se hos Akademibokhandeln" }
    ]},
    { title: "Stray Kids", items: [
      { id: "skz", name: "Stray Kids-merch", desc: "Till exempel ett SKZOO-gosedjur av en av medlemmarna.", url: "https://www.bakbak.eu/?p=131896", label: "Se exempel" },
      { id: "skz-keyrings", name: "Stray Kids-nyckelringar (SKZOO, 8 st)", desc: "Set med åtta plyschnyckelringar på 12 cm, en för varje medlem.", url: "https://www.amazon.se/s?k=Stray+Kids+SKZOO+plysch+nyckelringar+8+st", label: "Sök på Amazon" },
      { id: "skz-tickets", name: "Biljetter till Stray Kids", desc: "Jag skulle jättegärna vilja gå på en konsert. Kolla datum och biljetter.", url: "https://www.livenation.se/search?q=Stray+Kids", label: "Se hos Live Nation" }
    ]},
    { title: "Skapa", items: [
      { id: "pins", name: "Pinsmaskin (VEVOR, 58 mm)", desc: "Gör egna pins av bilder du skriver ut. 100 pinsämnen ingår.", url: "https://www.amazon.se/s?k=VEVOR+button+maker+58mm", label: "Sök på Amazon" }
    ]}
  ];

  const groupsEl = document.getElementById("groups");
  GROUPS.forEach(group => {
    const sec = document.createElement("section");
    const h = document.createElement("h2");
    h.innerHTML = group.title + ' <span class="count">' + group.items.length + "</span>";
    const ul = document.createElement("ul");
    ul.className = "list";
    group.items.forEach(item => {
      const li = document.createElement("li");
      li.className = "item";
      const body = document.createElement("div");
      body.className = "body";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = item.name;
      body.append(name);
      if (item.tag) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = item.tag;
        body.append(tag);
      }
      const desc = document.createElement("div");
      desc.className = "desc";
      desc.textContent = item.desc;
      const a = document.createElement("a");
      a.className = "link";
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = item.label + " ↗";
      body.append(desc, a);
      li.append(body);
      ul.append(li);
    });
    sec.append(h, ul);
    groupsEl.append(sec);
  });

</script>
<script src="../assets/vinter.js"></script>
<script>
  Vinter.scene(document.getElementById("scene"), { horizon: 0.63, band: true, seed: 23 });
  Vinter.snow(document.getElementById("snow"), { density: 0.7 });
</script>
</body>
</html>
